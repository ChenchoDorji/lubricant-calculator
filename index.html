<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lubricant / Water Calculator</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f9f9f9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 25px 30px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1565c0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 5px rgba(25, 118, 210, 0.4);
    }

    .result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #e3f2fd;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #0d47a1;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
